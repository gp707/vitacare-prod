# The default Gradle daemon heap (512MB) OOM'd during a release build
# (R8 minification + CameraX/Navigation/Coil/material-icons-extended all
# added in phase 2) — bumped to a size that comfortably fits this
# project's actual dependency graph, not an arbitrarily large number.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
