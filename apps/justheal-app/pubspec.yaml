name: nursenow_app
description: "JustHeal — patient/family and organisation care requirement app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.0
  package_info_plus: ^10.0.0
  firebase_core: ^3.6.0
  # Below: only needed by the ported caregiver flow (lib/caregiver/) —
  # image_picker/file_picker/image for selfie + document uploads at
  # caregiver registration, firebase_messaging for the "New Job" FCM push.
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  image: ^4.2.0
  firebase_messaging: ^15.1.3
  vitacare_shared:
    path: ../../packages/vitacare_shared
  vitacare_ui:
    path: ../../packages/vitacare_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
