version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  vitacare_shared:
    path: ../vitacare_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/branding/
