          $ref: "#/components/responses/UnauthorizedError"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "UPLOAD_005"
