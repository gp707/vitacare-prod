  # ============================================================
  # AUDIT LOG ENDPOINTS
  # ============================================================
  /admin/audit-logs:
    get:
      tags: [Admin - Audit Logs]
      summary: List audit logs
      description: Paginated, filterable audit log list. Admin and Super Admin access.
      operationId: listAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by actor (who performed the action)
        - name: target_user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by target (who was affected)
        - name: action
          in: query
          schema:
            type: string
            enum:
              - registration
              - login
              - profile_updated
              - status_changed
              - code_changed
              - job_posted
              - job_closed
              - job_response
              - job_application_decided
              - job_updated
              - admin_edit_profile
              - admin_note_added
              - admin_created
              - admin_deactivated
              - phone_changed
              - edits_acknowledged
              - admin_document_uploaded
          description: Filter by action type
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Filter from date (ISO date)
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: Filter to date (ISO date)
      responses:
        "200":
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                data:
                  - id: "d4e5f6a7-b8c9-0123-def0-345678901234"
                    user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                    user_name: "Admin One"
                    target_user_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    target_user_name: "Ramesh Kumar"
                    action: "status_changed"
                    entity_type: "caregiver_profiles"
                    entity_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    job_number: null
                    job_id: null
                    before_value:
                      verification_status: "pending_call"
                    after_value:
                      verification_status: "available"
                    ip_address: "192.168.1.1"
                    created_at: "2026-08-01T14:30:00Z"
                meta:
                  page: 1
                  limit: 20
                  total: 100
                  totalPages: 5
        "400":
