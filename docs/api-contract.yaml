  /admin/users/{id}:
    put:
      tags: [Admin - Users]
      summary: Update admin account
      description: Update admin account details. Super Admin only.
      operationId: updateAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Admin user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^\+91[6-9]\d{9}$'
                full_name:
                  type: string
                  maxLength: 100
                  pattern: '^[a-zA-Z\s]+$'
                password:
                  type: string
                  minLength: 6
                  description: "If provided, updates the password"
      responses:
        "200":
          description: Admin updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: "Admin updated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_004"
                  message: "Admin user not found"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Admin - Users]
      summary: Deactivate admin account
      description: |
        Soft-deletes an admin by setting `is_active = false`. Super Admin only.
        Cannot deactivate yourself or a super_admin.
      operationId: deactivateAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Admin user ID
      responses:
        "200":
          description: Admin deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: "Admin deactivated"
        "400":
          description: Cannot deactivate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
