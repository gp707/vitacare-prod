  /caregiver/profile/documents:
    post:
      tags: [Caregiver Profile]
      summary: Upload documents
      description: |
        Upload qualification, Aadhaar, or other documents via multipart form data.
        - `qualification` and `aadhaar`: One file each, re-upload overwrites.
        - `other`: Up to 3 files maximum.
        Max 10MB per file. No file type restriction.
      operationId: uploadDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Document file. Max 10MB."
                document_type:
                  $ref: "#/components/schemas/DocumentType"
      responses:
        "200":
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      document_type:
                        $ref: "#/components/schemas/DocumentType"
                      file_path:
                        type: string
              example:
                success: true
                data:
                  message: "Document uploaded"
                  document_type: "aadhaar"
                  file_path: "caregiver-documents/b2c3d4e5-f6a7-8901-bcde-f12345678901/aadhaar.pdf"
        "400":
          description: Upload validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_file:
                  summary: No file provided
                  value:
                    success: false
                    error:
                      code: "UPLOAD_001"
                      message: "File is required"
                too_large:
                  summary: File exceeds size limit
                  value:
                    success: false
                    error:
                      code: "UPLOAD_002"
                      message: "File size exceeds 10MB limit"
                max_other_docs:
                  summary: Too many other documents
                  value:
                    success: false
                    error:
                      code: "UPLOAD_003"
                      message: "Maximum 3 additional documents allowed"
                invalid_type:
                  summary: Invalid document type
                  value:
                    success: false
                    error:
                      code: "UPLOAD_004"
                      message: "Invalid document_type. Must be: qualification, aadhaar, or other"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "UPLOAD_005"
                  message: "File upload failed. Please try again."

  /caregiver/verification-status:
    get:
      tags: [Caregiver Profile]
      summary: Get verification status
      description: Returns current verification status, rejection message, and key timestamps.
      operationId: getVerificationStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      verification_status:
                        $ref: "#/components/schemas/VerificationStatus"
                      rejection_message:
                        type: string
                        nullable: true
                      verified_at:
                        type: string
                        format: date-time
                        nullable: true
              example:
                success: true
                data:
                  verification_status: "pending_call"
                  rejection_message: null
                  verified_at: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/mark-available:
    post:
      tags: [Caregiver Profile]
      summary: One-click "Mark Available"
      description: >
        The caregiver-app's single self-service action for becoming
        available again. No request body. From unavailable or assigned,
        sets verification_status to available (only that field — never
        touches the job or job_applications row, mirroring the admin
        status-override endpoint's scope). Already available is a no-op
        (already_available: true, no write, no audit entry). From
        pending_call or rejected, 400s with PROFILE_022 — a rejected
        caregiver must instead edit their profile, which auto-resubmits.
        There is currently no self-service way to go the other direction
        (available -> unavailable); that's still admin-only.
      operationId: markAvailable
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status updated (or already available)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      verification_status:
                        type: string
                        enum: [available]
                      already_available:
                        type: boolean
              example:
                success: true
                data:
                  message: "Status updated"
                  verification_status: "available"
                  already_available: false
        "400":
          description: Ineligible current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "PROFILE_022"
                  message: "Cannot mark yourself available from your current status"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/fcm-token:
    put:
      tags: [Caregiver Profile]
      summary: Update FCM token
      description: Update the Firebase Cloud Messaging token for push notifications. Call after registration, on each app launch, and when token refreshes.
      operationId: updateFcmToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: "Firebase Cloud Messaging device token"
                  example: "dK8xM2nQR_-abc123..."
      responses:
        "200":
          description: Token updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: "FCM token updated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "PROFILE_021"
                  message: "FCM token is required"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # CAREGIVER JOBS ENDPOINTS (SPEC.md 6.6)
  # ============================================================
  /caregiver/jobs:
    get:
      tags: [Caregiver Jobs]
      summary: List active job postings
      description: |
        Viewable at ANY verification status — browsing motivates completing
        onboarding. Only applying is gated. Server-side filtered to jobs
        whose `preferred_gender` is unset or matches the caregiver's own
        gender — a caregiver never sees a job posted for the other gender.
        Also dynamically filtered by the caregiver's own job search
        preferences (set via PATCH /caregiver/profile): `city` must be in
        `preferred_cities` (or that list is empty), `duty_type` must be in
        `preferred_duty_types` (or that list is empty), and `salary_amount`
        must meet `min_salary_per_day`/`min_salary_per_month` for the job's
        own `frequency_of_care` — read fresh on every request, so a
        preference change takes effect on the next fetch. Each item includes
        `my_application` (null if this caregiver hasn't applied yet) — the
        real per-transition timeline, not just a bare status, so the app
        can distinguish "you declined it" from "the employer declined you"
        (an admin rejecting a still-applied application, or undoing a
        prior acceptance, both set decided_by_admin: true).
        The caregiver-app highlights the job's display id
        ("ADMIN-JOB-<n>"/"PAT-JOB-<n>", from admin_job_number/patient_job_number) and
        `salary_amount` (unit — ₹/day or ₹/month — follows
        `frequency_of_care`) at the top of each card, plus a 3-day apply-by
        urgency message computed client-side from `posted_at` — purely
        informational, never blocks applying.
      operationId: listCaregiverJobs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Active jobs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Job"
                        - type: object
                          properties:
                            my_application:
                              type: object
                              nullable: true
                              description: >
                                Null if the caregiver has never applied.
                                Otherwise the full timeline of this
                                application, not just its current status.
                              properties:
                                status:
                                  type: string
                                  enum: [applied, rejected, accepted]
                                applied_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: Null if they declined without ever applying.
                                accepted_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: Set only when an admin has accepted this application.
                                rejected_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                decided_by_admin:
                                  type: boolean
                                  description: >
                                    True whenever an admin's decision (not
                                    the caregiver's own action) produced
                                    the current status — covers both
                                    rejecting a still-applied application
                                    and undoing a prior acceptance. Both
                                    should read as "declined by the
                                    employer", not "you declined".
                            care_receiver:
                              allOf:
                                - $ref: "#/components/schemas/CareReceiver"
                              description: >
                                Always present (joined via care_receiver_id,
                                which is NOT NULL). Unlike GET /admin/jobs
                                (the admin list, summary rows only), the
                                caregiver list always includes the full
                                care_receiver so About Patient / About
                                Patient Condition details are visible
                                directly on the jobs list.
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/jobs/assigned:
    get:
      tags: [Caregiver Jobs]
      summary: Get my currently/most-recently assigned job
      description: >
        GET /caregiver/jobs only lists active jobs, and accepting an
        application immediately closes the job — so without this endpoint,
        an assigned caregiver would have no way to see their own job's
        details again once it closes. Returns the full Job (with
        care_receiver) for the job_applications row with status=accepted
        and the most recent updated_at for this caregiver, regardless of
        the job's current status. Returns data: null (not 404) when the
        caregiver has never been accepted onto a job — that's the normal
        state for most caregivers. Also includes job_poster (the posting
        admin's full_name + phone, nothing else) — surfaced here only,
        never on the browse list, since contact info is only shared once
        there's an actual accepted engagement.
      operationId: getMyAssignedJob
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Assigned job (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Job"
                      - type: object
                        properties:
                          care_receiver:
                            $ref: "#/components/schemas/CareReceiver"
                          job_poster:
                            type: object
                            nullable: true
                            description: The posting admin's contact info, so the caregiver can reach out. Null if that admin account no longer exists.
                            properties:
                              full_name: { type: string }
                              phone: { type: string }
              example:
                success: true
                data: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/jobs/{id}/apply:
    post:
      tags: [Caregiver Jobs]
      summary: Apply to (or reject) a job posting
      description: |
        Only `available`/`assigned` caregivers can apply (`unavailable`
        must toggle back to available first) — JOB_001 otherwise.
        Re-applying updates the existing application rather than
        duplicating it. `accepted` is admin-only — see
        `PATCH /admin/jobs/{jobId}/applications/{applicationId}`.
      operationId: applyToJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [applied, rejected]
            example:
              status: "applied"
      responses:
        "200":
          description: Application recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
