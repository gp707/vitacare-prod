          $ref: "#/components/responses/InternalError"

  # ============================================================
  # SUPER ADMIN USER MANAGEMENT ENDPOINTS
  # ============================================================
  /admin/users:
    post:
      tags: [Admin - Users]
      summary: Create admin account
      description: Create a new admin account. Super Admin only.
      operationId: createAdmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, full_name, password]
              properties:
                email:
                  type: string
                  format: email
                  description: "Must be unique"
                  example: "newadmin@vitacasahealth.in"
                phone:
                  type: string
                  pattern: '^\+91[6-9]\d{9}$'
                  description: "Indian mobile number. Must be unique."
                  example: "+919999999999"
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z\s]+$'
                  description: "Full name"
                  example: "Admin User"
                password:
                  type: string
                  minLength: 6
                  description: "Minimum 6 characters"
                  example: "securepassword"
      responses:
        "201":
          description: Admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [admin]
              example:
                success: true
                data:
                  user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                  email: "newadmin@vitacasahealth.in"
                  role: "admin"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_003"
                  message: "Admin with this email already exists"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Admin - Users]
      summary: List admin accounts
      description: List all admin accounts. Super Admin only.
      operationId: listAdmins
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
              example:
                success: true
                data:
                  - user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                    email: "admin1@vitacasahealth.in"
                    phone: "+919999999999"
                    full_name: "Admin One"
                    role: "admin"
                    is_active: true
                    created_at: "2026-08-01T10:00:00Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}:
    put:
      tags: [Admin - Users]
      summary: Update admin account
      description: Update admin account details. Super Admin only.
      operationId: updateAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Admin user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^\+91[6-9]\d{9}$'
                full_name:
                  type: string
                  maxLength: 100
                  pattern: '^[a-zA-Z\s]+$'
                password:
                  type: string
                  minLength: 6
                  description: "If provided, updates the password"
      responses:
        "200":
          description: Admin updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: "Admin updated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_004"
                  message: "Admin user not found"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Admin - Users]
      summary: Deactivate admin account
      description: |
        Soft-deletes an admin by setting `is_active = false`. Super Admin only.
        Cannot deactivate yourself or a super_admin.
      operationId: deactivateAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Admin user ID
      responses:
        "200":
          description: Admin deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: "Admin deactivated"
        "400":
          description: Cannot deactivate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                self_deactivation:
                  summary: Self-deactivation
                  value:
                    success: false
                    error:
                      code: "ADMIN_005"
                      message: "Cannot deactivate your own account"
                super_admin:
                  summary: Cannot deactivate super admin
                  value:
                    success: false
                    error:
                      code: "ADMIN_006"
                      message: "Cannot deactivate a super admin"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_004"
                  message: "Admin user not found"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}/activate:
    patch:
      tags: [Admin - Users]
      summary: Reactivate a deactivated admin account
      description: |
        Sets `is_active = true` on a previously-deactivated admin. Super Admin
        only. Idempotent — succeeds even if the admin is already active.
      operationId: activateAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Admin user ID
      responses:
        "200":
          description: Admin activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: "Admin activated"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_004"
                  message: "Admin user not found"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}/role:
    patch:
      tags: [Admin - Users]
      summary: Change an admin's role (promote to / demote from super_admin)
      description: |
        Sets an admin's role to `admin` or `super_admin`. Super Admin only.
        Cannot change your own role, and cannot demote the last remaining
        active super_admin (the system must always have at least one).
      operationId: updateAdminRole
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Admin user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, super_admin]
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum: [admin, super_admin]
              example:
                success: true
                data:
                  user_id: "uuid"
                  role: "super_admin"
        "400":
          description: Cannot change role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                self_role_change:
                  summary: Self-role-change
                  value:
                    success: false
                    error:
                      code: "ADMIN_012"
                      message: "Cannot change your own role"
                last_super_admin:
                  summary: Cannot demote the last super admin
                  value:
                    success: false
                    error:
                      code: "ADMIN_013"
                      message: "Cannot demote the last super admin"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_004"
                  message: "Admin user not found"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # AUDIT LOG ENDPOINTS
  # ============================================================
  /admin/audit-logs:
    get:
      tags: [Admin - Audit Logs]
      summary: List audit logs
      description: Paginated, filterable audit log list. Admin and Super Admin access.
      operationId: listAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by actor (who performed the action)
        - name: target_user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by target (who was affected)
        - name: action
          in: query
          schema:
            type: string
            enum:
              - registration
              - login
              - call_verified
              - advanced_details_submitted
              - profile_updated
              - status_changed
              - code_changed
              - service_mode_assigned
              - job_posted
              - job_closed
              - job_response
              - admin_edit_profile
              - admin_note_added
              - admin_created
              - admin_deactivated
              - phone_changed
              - edits_acknowledged
              - admin_document_uploaded
          description: Filter by action type
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Filter from date (ISO date)
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: Filter to date (ISO date)
      responses:
        "200":
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                data:
                  - id: "d4e5f6a7-b8c9-0123-def0-345678901234"
                    user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                    user_name: "Admin One"
                    target_user_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    target_user_name: "Ramesh Kumar"
                    action: "status_changed"
                    entity_type: "caregiver_profiles"
                    entity_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    before_value:
                      verification_status: "pending_verification"
                    after_value:
                      verification_status: "available"
                    ip_address: "192.168.1.1"
                    created_at: "2026-08-01T14:30:00Z"
                meta:
                  page: 1
                  limit: 20
                  total: 100
                  totalPages: 5
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "GEN_005"
                  message: "Invalid pagination parameters"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # ADMIN JOBS ENDPOINTS (SPEC.md 6.6)
  # ============================================================
  /admin/jobs:
    post:
      tags: [Admin - Jobs]
      summary: Post a new job
      description: |
        Creates a job (status `active`) and broadcasts a push notification
        to every caregiver with an FCM token, regardless of verification
        status (browsing motivates onboarding).
      operationId: createJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_type, city, description, duty_timings, language, gender_needed, religion]
              properties:
                work_type:
                  $ref: "#/components/schemas/WorkType"
                city:
                  $ref: "#/components/schemas/City"
                description:
                  type: string
                duty_timings:
                  $ref: "#/components/schemas/ServiceMode"
                language:
                  $ref: "#/components/schemas/Language"
                gender_needed:
                  type: string
                  enum: [male, female]
                  description: "Jobs table only allows male/female, unlike the general Gender enum."
                religion:
                  $ref: "#/components/schemas/Religion"
            example:
              work_type: "bedside_care"
              city: "bangalore"
              description: "Need a bedside caregiver for an elderly patient, 24/7."
              duty_timings: "24hrs_live_in"
              language: "hindi"
              gender_needed: "female"
              religion: "hindu"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Admin - Jobs]
      summary: List job postings
      operationId: listJobs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { type: string, enum: [active, closed] }
        - name: work_type
          in: query
          schema:
            $ref: "#/components/schemas/WorkType"
        - name: city
          in: query
          schema:
            $ref: "#/components/schemas/City"
      responses:
        "200":
          description: Job list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{id}:
    get:
      tags: [Admin - Jobs]
      summary: Get job detail with all caregiver responses
      operationId: getJobDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job detail retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Job"
                      - type: object
                        properties:
                          responses:
                            type: array
                            items:
                              $ref: "#/components/schemas/JobResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{id}/close:
    patch:
      tags: [Admin - Jobs]
      summary: Close a job posting
      description: Sets status to `closed` — closed jobs no longer accept caregiver responses (JOB_002).
      operationId: closeJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string, enum: [closed] }
              example:
                success: true
                data: { message: "Job closed", status: "closed" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{id}/remind:
    post:
      tags: [Admin - Jobs]
      summary: Send a reminder push for an existing job posting
      description: |
        Re-broadcasts a push notification to every caregiver reminding them
        to apply, reusing the same title/body format as the initial posting
        push but with reminder copy. Only allowed while the job is still
        `active` (JOB_005 otherwise).
      operationId: sendJobReminder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
              example:
                success: true
                data: { message: "Reminder sent" }
        "400":
          description: Job is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_005", message: "Cannot send a reminder for a closed job" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"
