                    properties:
                      message: { type: string }
                      status: { type: string, enum: [closed] }
              example:
                success: true
                data: { message: "Job closed", status: "closed" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{id}/reject:
    patch:
      tags: [Admin - Jobs, NurseNow - Individual]
      summary: Reject a NurseNow individual's pending-review requirement
      description: >
        Only valid from status pending_review (JOB_011 otherwise) — declines
        a NurseNow individual's posting, which never goes live. Sets status
        to closed and stores rejection_reason, visible to the individual on
        their own GET /individual/requirements. Admin's own postings never
        reach pending_review, so this is only ever used on NurseNow postings.
      operationId: rejectJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  example: "Does not meet our coverage area"
      responses:
        "200":
          description: Requirement rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/Job"
        "400":
          description: Job is not pending_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_011", message: "Only a pending-review requirement can be rejected" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{id}/remind:
    post:
      tags: [Admin - Jobs]
      summary: Send a reminder push for an existing job posting
      description: |
        Re-broadcasts a push notification to every caregiver reminding them
        to apply, reusing the same title/body format as the initial posting
        push but with reminder copy. Only allowed while the job is still
        `active` (JOB_005 otherwise).
      operationId: sendJobReminder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
              example:
                success: true
                data: { message: "Reminder sent" }
        "400":
          description: Job is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_005", message: "Cannot send a reminder for a closed job" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{jobId}/applications/{applicationId}:
    patch:
      tags: [Admin - Jobs]
      summary: Accept or reject a specific applicant
      description: |
        This IS the offer confirmation — admin has already contacted the
        caregiver outside the app before calling this; there is no separate
        in-app caregiver "accept offer" step. Only two transitions are
        valid: `applied` -> `accepted`/`rejected`, and `accepted` ->
        `rejected` (admin reversing a prior acceptance). Anything else
        (double-accept, re-deciding an already-rejected application) is
        JOB_007.

        Side effects:
        - `applied` -> `accepted`: this application updates; the job closes
          (`status = 'closed'`, no further applications accepted); the
          caregiver's `verification_status` becomes `assigned`.
        - `accepted` -> `rejected`: this application updates; the job
          reopens (`status = 'active'`); the caregiver's
          `verification_status` becomes `available`.
        - `applied` -> `rejected`: just declines this one application — no
          effect on the job or the caregiver's status.
        - Other still-`applied` applications on the same job are left
          untouched either way.
      operationId: decideApplication
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                reason:
                  type: string
                  maxLength: 1000
                  description: >
                    Optional here (admin's reject doesn't require one) — a NurseNow individual's
                    equivalent decision at PATCH /individual/requirements/{jobId}/applications/
                    {applicationId} does require it. Stored in decline_reason either way.
            example:
              status: "accepted"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string }
              example:
                success: true
                data: { message: "Application updated", status: "accepted" }
        "400":
          description: Invalid status value or application already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_status:
                  summary: Invalid status value
                  value:
                    success: false
                    error: { code: "JOB_004", message: "Invalid application status value" }
                already_decided:
                  summary: Application already decided
                  value:
                    success: false
                    error: { code: "JOB_007", message: "Application has already been decided" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Application not found, or doesn't belong to this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_006", message: "Application not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /individual/me:
    get:
      tags: [NurseNow - Individual]
