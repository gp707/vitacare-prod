        "500":
          $ref: "#/components/responses/InternalError"

  /admin/jobs/{jobId}/applications/{applicationId}:
    patch:
      tags: [Admin - Jobs]
      summary: Accept or reject a specific applicant
      description: |
        This IS the offer confirmation — admin has already contacted the
        caregiver outside the app before calling this; there is no separate
        in-app caregiver "accept offer" step. Only two transitions are
        valid: `applied` -> `accepted`/`rejected`, and `accepted` ->
        `rejected` (admin reversing a prior acceptance). Anything else
        (double-accept, re-deciding an already-rejected application) is
        JOB_007.

        Side effects:
        - `applied` -> `accepted`: this application updates; the job closes
          (`status = 'closed'`, no further applications accepted); the
          caregiver's `verification_status` becomes `assigned`.
        - `accepted` -> `rejected`: this application updates; the job
          reopens (`status = 'active'`); the caregiver's
          `verification_status` becomes `available`.
        - `applied` -> `rejected`: just declines this one application — no
          effect on the job or the caregiver's status.
        - Other still-`applied` applications on the same job are left
          untouched either way.
      operationId: decideApplication
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
            example:
              status: "accepted"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string }
              example:
                success: true
                data: { message: "Application updated", status: "accepted" }
        "400":
          description: Invalid status value or application already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_status:
                  summary: Invalid status value
                  value:
                    success: false
                    error: { code: "JOB_004", message: "Invalid application status value" }
                already_decided:
                  summary: Application already decided
                  value:
                    success: false
                    error: { code: "JOB_007", message: "Application has already been decided" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Application not found, or doesn't belong to this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_006", message: "Application not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /app-versions/check:
    get:
      tags: [App Versions]
      summary: Check whether the caller's app build is below the admin-configured minimum
      description: |
        Public — no auth. Called by the caregiver app on every cold launch, before the splash
        screen even loads the session, so a caregiver who's never logged in still gets blocked
        on a too-old build. Fails open on the client side: any error here is treated as "no
        update needed."
      operationId: checkAppVersion
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: string, enum: [android, ios] }
        - name: version
          in: query
          required: true
          schema: { type: string }
          example: "1.1.0"
      responses:
        "200":
          description: Version check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/VersionCheckResult"
        "400":
          description: Missing/malformed platform or version (an unrecognized platform is rejected here too, by DTO validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_001", message: "Invalid request body" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/app-versions:
    get:
      tags: [Admin - App Versions]
      summary: List the minimum supported version for every platform
      operationId: listAppVersions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: App version list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppMinVersion"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/app-versions/{platform}:
    patch:
      tags: [Admin - App Versions]
      summary: Set the minimum supported version, store URL, and update message for a platform
      description: |
        Raising min_version above what a caregiver has installed blocks them with an "Update
        Required" screen on their next launch. Audit-logs app_version_updated with before/after
        min_version and store_url.
      operationId: updateAppVersion
      security:
        - BearerAuth: []
      parameters:
        - name: platform
          in: path
          required: true
          schema: { type: string, enum: [android, ios] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppVersionRequest"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/AppMinVersion"
        "400":
          description: Malformed min_version (must be x.y.z)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_001", message: "Invalid request body" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Unrecognized platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"
