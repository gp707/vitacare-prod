  /admin/caregivers/{id}/status:
    patch:
      tags: [Admin - Caregivers]
      summary: Update verification status (admin override — unrestricted)
      description: |
        Sets a caregiver's verification status directly. There is no separate
        "mark call verified" step — admin reviews the full profile (every field, including
        documents, is collected at registration) while it sits in `pending_call` and approves
        or rejects directly via this endpoint. Deliberately
        unrestricted: admin can set ANY of the 5 statuses from ANY current
        status — there is no transition-matrix check on this endpoint
        (CLAUDE.md documents the *normal* flow that caregiver actions,
        system triggers, and admin-web's quick-action buttons produce, but
        this endpoint is a free-form override on top of that).

        Side effects, regardless of the "from" status:
        - Target `available`: stamps `verified_at`/`verified_by`, clears `rejection_message`.
        - Target `rejected`: sets `rejection_message` to the given value (or null).
        - Every other target: clears `rejection_message`, leaves `verified_at`/`verified_by` untouched.

        Sends a push notification to the caregiver for `available` and `rejected` targets only.
      operationId: updateCaregiverStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Caregiver profile ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/VerificationStatus"
                rejection_message:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: "Only relevant when status is 'rejected'. Max 1000 characters."
                  example: "Aadhaar document is not clearly legible. Please re-upload."
            example:
              status: "available"
              rejection_message: null
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      verification_status:
                        $ref: "#/components/schemas/VerificationStatus"
              example:
                success: true
                data:
                  message: "Status updated"
                  verification_status: "available"
        "400":
          description: Invalid status transition or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_transition:
                  summary: Invalid status transition
                  value:
                    success: false
                    error:
                      code: "ADMIN_001"
                      message: "Invalid status transition from pending_call to available"
                rejection_too_long:
                  summary: Rejection message too long
                  value:
                    success: false
                    error:
                      code: "ADMIN_007"
                      message: "Rejection message must be under 1000 characters"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Caregiver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "PROFILE_019"
                  message: "Caregiver profile not found"
        "500":
          $ref: "#/components/responses/InternalError"

