                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum: [admin, super_admin]
              example:
                success: true
                data:
                  user_id: "uuid"
                  role: "super_admin"
        "400":
          description: Cannot change role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                self_role_change:
                  summary: Self-role-change
                  value:
                    success: false
                    error:
                      code: "ADMIN_012"
                      message: "Cannot change your own role"
