                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_004"
                  message: "Admin user not found"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}/role:
    patch:
      tags: [Admin - Users]
      summary: Change an admin's role (promote to / demote from super_admin)
      description: |
        Sets an admin's role to `admin` or `super_admin`. Super Admin only.
        Cannot change your own role, and cannot demote the last remaining
        active super_admin (the system must always have at least one).
      operationId: updateAdminRole
      security:
