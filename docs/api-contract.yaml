  # ============================================================
  # AUDIT LOG ENDPOINTS
  # ============================================================
  /admin/audit-logs:
    get:
      tags: [Admin - Audit Logs]
      summary: List audit logs
      description: Paginated, filterable audit log list. Admin and Super Admin access.
      operationId: listAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by actor (who performed the action)
        - name: target_user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by target (who was affected)
        - name: action
          in: query
          schema:
            type: string
            enum:
              - registration
              - login
              - profile_updated
              - status_changed
              - code_changed
              - job_posted
              - job_closed
              - job_response
              - job_application_decided
              - job_updated
              - admin_edit_profile
              - admin_note_added
              - admin_created
              - admin_deactivated
              - phone_changed
              - edits_acknowledged
              - admin_document_uploaded
          description: Filter by action type
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Filter from date (ISO date)
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: Filter to date (ISO date)
      responses:
        "200":
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                data:
                  - id: "d4e5f6a7-b8c9-0123-def0-345678901234"
                    user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                    user_name: "Admin One"
                    target_user_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    target_user_name: "Ramesh Kumar"
                    action: "status_changed"
                    entity_type: "caregiver_profiles"
                    entity_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    job_number: null
                    admin_job_number: null
                    patient_job_number: null
                    job_id: null
                    before_value:
                      verification_status: "pending_call"
                    after_value:
                      verification_status: "available"
                    ip_address: "192.168.1.1"
                    created_at: "2026-08-01T14:30:00Z"
                meta:
                  page: 1
                  limit: 20
                  total: 100
                  totalPages: 5
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "GEN_005"
                  message: "Invalid pagination parameters"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # ADMIN JOBS ENDPOINTS (SPEC.md 6.6)
  # ============================================================
  /admin/jobs:
    post:
      tags: [Admin - Jobs]
      summary: Post a new job
      description: |
        Creates a job (status `active`) and broadcasts a push notification
        to every caregiver with an FCM token, regardless of verification
        status (browsing motivates onboarding).
      operationId: createJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [care_receiver, city, duty_type, frequency_of_care, start_date, languages, salary_amount]
              properties:
                care_receiver:
                  type: object
                  description: 'Labeled "About Patient" in the admin-web UI.'
                  required:
                    [
                      age,
                      gender,
                      weight_kg,
                      mobility,
                      communication,
                      feeding_type,
                      medical_assistance,
                      has_medical_condition,
                      toilet_assistance,
                      requires_vital_monitoring,
                    ]
                  properties:
                    age:
                      type: integer
                      minimum: 1
                      maximum: 120
                      description: "Required — one of only 3 hard-required care-receiver fields (with gender, weight_kg)."
                    gender:
                      $ref: "#/components/schemas/Gender"
                      description: "Required."
                    weight_kg:
                      type: integer
                      minimum: 1
                      maximum: 300
                      description: "Required."
                    mobility:
                      $ref: "#/components/schemas/Mobility"
                      description: "Optional — defaults to walks_independently when omitted."
                    communication:
                      $ref: "#/components/schemas/Communication"
                      description: "Optional — defaults to verbal when omitted."
                    feeding_type:
                      $ref: "#/components/schemas/FeedingType"
                      description: "Optional — defaults to oral_independent when omitted. Sufficient on its own (tube_feeding/oral_and_tube) — no separate assistance question."
                    medical_assistance:
                      type: array
                      items:
                        $ref: "#/components/schemas/MedicalAssistance"
                      description: "Optional — an omitted or empty array defaults to [medication_reminders]."
                    has_medical_condition:
                      type: boolean
                      description: "Optional — defaults to false when omitted."
                    medical_conditions:
                      type: array
                      items:
                        $ref: "#/components/schemas/MedicalCondition"
                      description: "Required if has_medical_condition is true; not validated otherwise."
                    medical_condition_other:
                      type: string
                      maxLength: 500
                      description: "Optional free text, unconditionally accepted server-side. Admin-web shows/sends it only when medical_conditions includes 'other'."
                    toilet_assistance:
                      type: array
                      items:
                        $ref: "#/components/schemas/ToiletAssistance"
                      description: "Optional — multi-select, admin can pick more than one. An omitted or empty array defaults to [independent]."
                    toilet_assistance_other:
                      type: string
                      maxLength: 500
                      description: "Optional free text, unconditionally accepted server-side. Admin-web shows/sends it only when toilet_assistance includes 'others'."
                    requires_vital_monitoring:
                      type: boolean
                      description: "Optional — defaults to false when omitted."
                    vital_monitoring_types:
                      type: array
                      items:
                        $ref: "#/components/schemas/VitalMonitoringType"
                      description: "Required non-empty if requires_vital_monitoring is true; not validated otherwise."
                city:
                  $ref: "#/components/schemas/City"
                area:
                  type: string
                  description: "Required free text (previously optional)."
                description:
                  type: string
                  description: >
                    Optional (previously required), max 2000 chars. UI label
                    shortened to "More details you want to share about
                    patient".
                duty_type:
                  $ref: "#/components/schemas/DutyType"
                  description: >
                    One of exactly 3 fixed shifts — no separate start_time/
                    end_time input; the backend derives and stores those
                    from duty_type. UI label: "Hours Care Needed".
                frequency_of_care:
                  $ref: "#/components/schemas/FrequencyOfCare"
                  description: "Required."
                start_date:
                  type: string
                  format: date
                  description: >
                    Required (previously optional). UI label "Preferred
                    Start Date".
                languages:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/Language"
                  description: "Required, non-empty. Multi-select preference — informational, never used as a filter."
                salary_amount:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: "Required. Unit follows frequency_of_care (₹/day for daily, ₹/month for monthly). Shown highlighted at the top of the job card in caregiver-app."
                preferred_gender:
                  type: string
                  enum: [male, female]
                  description: "Optional — omitted means no preference. Never used as a filter."
                preferred_religion:
                  type: string
                  enum: [hindu, muslim, christian]
                  description: >
                    Optional — omitted means no preference. Never used as a
                    filter. "others" is excluded (valid for a caregiver's
                    own religion at registration, not offered as a job
                    preference).
            example:
              care_receiver:
                age: 72
                gender: "female"
                weight_kg: 58
                mobility: "walks_with_assistance"
                communication: "verbal"
                feeding_type: "oral_needs_assistance"
                medical_assistance: ["medication_reminders"]
                has_medical_condition: true
                medical_conditions: ["diabetes"]
                medical_condition_other: null
                toilet_assistance: ["uses_diapers"]
                toilet_assistance_other: null
                requires_vital_monitoring: true
                vital_monitoring_types: ["blood_pressure", "blood_sugar"]
              city: "bangalore"
              area: "Indiranagar"
              description: "Elderly patient, 72 years, post hip surgery."
              duty_type: "live_in"
              frequency_of_care: "daily"
              start_date: "2026-08-10"
              languages: ["hindi", "english"]
              salary_amount: 30000
              preferred_gender: "female"
              preferred_religion: "hindu"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Admin - Jobs]
      summary: List job postings
      operationId: listJobs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { type: string, enum: [active, closed] }
        - name: city
          in: query
          schema:
            $ref: "#/components/schemas/City"
      responses:
        "200":
          description: Job list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

