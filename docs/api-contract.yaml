  # ============================================================
  # SUPER ADMIN USER MANAGEMENT ENDPOINTS
  # ============================================================
  /admin/users:
    post:
      tags: [Admin - Users]
      summary: Create admin account
      description: Create a new admin account. Super Admin only.
      operationId: createAdmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, full_name, password]
              properties:
                email:
                  type: string
                  format: email
                  description: "Must be unique"
                  example: "newadmin@vitacasahealth.in"
                phone:
                  type: string
                  pattern: '^\+91[6-9]\d{9}$'
                  description: "Indian mobile number. Must be unique."
                  example: "+919999999999"
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z\s]+$'
                  description: "Full name"
                  example: "Admin User"
                password:
                  type: string
                  minLength: 6
                  description: "Minimum 6 characters"
                  example: "securepassword"
      responses:
        "201":
          description: Admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [admin]
              example:
                success: true
                data:
                  user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                  email: "newadmin@vitacasahealth.in"
                  role: "admin"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "ADMIN_003"
                  message: "Admin with this email already exists"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Admin - Users]
      summary: List admin accounts
      description: List all admin accounts. Super Admin only.
      operationId: listAdmins
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
              example:
                success: true
                data:
                  - user_id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
                    email: "admin1@vitacasahealth.in"
                    phone: "+919999999999"
                    full_name: "Admin One"
                    role: "admin"
                    is_active: true
                    created_at: "2026-08-01T10:00:00Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}:
    put:
      tags: [Admin - Users]
      summary: Update admin account
      description: Update admin account details. Super Admin only.
      operationId: updateAdmin
