        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/individuals/{id}/block:
    patch:
      tags: [Admin - Individuals]
      summary: Block an individual account
      description: >
        level=job_posting only stops new POST /individual/requirements
        (JOB_010) — an existing live requirement and its applications keep
        working, and login still succeeds. level=full sets users.is_active
        to false — a total login lockout (AUTH_004), same as a deactivated
        admin/caregiver.
      operationId: blockIndividual
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, reason]
              properties:
                level:
                  type: string
                  enum: [job_posting, full]
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Account blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/individuals/{id}/unblock:
    patch:
      tags: [Admin - Individuals]
      summary: Unblock an individual account
      operationId: unblockIndividual
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [job_posting, full]
      responses:
        "200":
          description: Account unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/me:
    get:
      tags: [NurseNow - Organisation]
      summary: Get the caller's own NurseNow organisation account
      operationId: getOrganisationMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      org_number:
                        type: integer
                        nullable: true
                        description: >
                          Human-friendly sequential id, starts at 500 (migration 046) —
                          displayed as "ORG-<n>" client-side.
                      organisation_name: { type: string }
                      contact_person_name: { type: string }
                      organisation_type:
                        $ref: "#/components/schemas/OrganisationType"
                      city: { type: string }
                      area: { type: string }
                      phone: { type: string }
                      is_job_posting_blocked: { type: boolean }
              example:
                success: true
                data:
                  user_id: "f1a2b3c4-d5e6-7890-fabc-123456789012"
                  org_number: 500
                  organisation_name: "Sunrise Rehab"
                  contact_person_name: "Ravi Sharma"
                  organisation_type: "rehab"
                  city: "bangalore"
                  area: "Indiranagar"
                  phone: "+919876543211"
                  is_job_posting_blocked: false
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/requirements:
    post:
      tags: [NurseNow - Organisation]
      summary: Post a new organisation requirement
      description: >
        No care_receiver, no city/area/duty_type (inherited from the org's
        own organisation_profiles row), and no frequency_of_care/
        salary_amount/schedule, which admin sets on approval. Always
        created with status pending_review. Unlike Individual, there is NO
        one-live-requirement limit — an org can have many simultaneous
        pending_review/active requirements.
      operationId: createOrganisationRequirement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_of_nurse, accommodation_provided, food_provided]
              properties:
                type_of_nurse:
                  $ref: "#/components/schemas/TypeOfNurse"
                accommodation_provided:
                  type: boolean
                food_provided:
                  type: boolean
                special_skills:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Requirement created (pending_review)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/OrganisationRequirement"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: Account is blocked from posting new requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_010", message: "Your account is blocked from posting new requirements" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [NurseNow - Organisation]
      summary: List the caller's own requirement history
      description: >
        The account's full requirement history, newest first — every past
        posting stays visible, not just current ones. frequency_of_care/
        salary_amount/schedule_type are null until admin approves;
        rejection_reason is set only on a rejected (closed) requirement.
      operationId: listMyOrganisationRequirements
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The caller's requirement history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganisationRequirement"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/requirements/{id}/applications:
    get:
      tags: [NurseNow - Organisation]
      summary: List applicants on the caller's own requirement
      description: >
        Ownership-checked — GEN_002 if the requirement isn't found or isn't
        owned by the caller. Callable regardless of the requirement's
        status, so the applicant list (including who was accepted) stays
        visible after the requirement closes.
      operationId: listOrganisationRequirementApplications
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Applicants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganisationRequirementApplication"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Requirement not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/requirements/{requirementId}/applications/{applicationId}/profile:
    get:
      tags: [NurseNow - Organisation]
      summary: An applicant's full profile
      description: >
        Ownership-checked both ways — the requirement must be this org's
        own AND the application must actually belong to it (GEN_002
        otherwise). Same full CaregiverProfile as Individual's equivalent
        endpoint (see
        /individual/requirements/{jobId}/applications/{applicationId}/profile).
        Organisation's applicant review is a free list, so this is callable
        for any/every applicant, not just one at a time.
      operationId: getOrganisationRequirementApplicantProfile
      security:
        - BearerAuth: []
      parameters:
        - name: requirementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Applicant's full profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/CaregiverProfile"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Requirement/application not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/requirements/{requirementId}/applications/{applicationId}:
    patch:
      tags: [NurseNow - Organisation]
      summary: Accept or reject an applicant on the caller's own requirement
      description: >
        Ownership-checked (GEN_002 if not the requirement's owner), then
        delegates to the same OrganisationRequirementsService.decideApplication
        method admin's own decide-application endpoint calls: accepting
        closes the requirement and assigns the caregiver; rejecting a
        still-applied applicant just declines them; rejecting a previously
        accepted applicant reopens the requirement and returns the
        caregiver to available. Unlike NurseNow - Individual's equivalent
        endpoint, `reason` is optional here — Organisation's applicant
        review is a free list, not a forced one-at-a-time/mandatory-reason
        flow (a deliberate asymmetry, see "NurseNow" in CLAUDE.md).
      operationId: decideMyOrganisationRequirementApplication
      security:
        - BearerAuth: []
      parameters:
        - name: requirementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                reason:
                  type: string
                  maxLength: 1000
                  description: Optional here (unlike NurseNow - Individual's mandatory JOB_012 rule).
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string, enum: [accepted, rejected] }
        "400":
          description: Application has already been decided, or an invalid status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_007", message: "Application has already been decided" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Requirement or application not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/profile/phone:
    patch:
      tags: [NurseNow - Organisation]
      summary: Change phone number
      description: >
        Self-service phone change, reusing caregiver's UpdatePhoneDto unchanged. No re-review
        reset — an organisation account has no verification pipeline. No-op (still 200) if the
        phone is unchanged.
      operationId: updateOrganisationPhone
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: "^\\+91[6-9]\\d{9}$"
                  example: "+919876500098"
      responses:
        "200":
          description: Phone number updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
              example:
                success: true
                data: { message: "Phone number updated" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: Phone number already registered to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "AUTH_001", message: "Phone number is already registered" }
        "500":
          $ref: "#/components/responses/InternalError"

  /organisation/profile/code:
    patch:
      tags: [NurseNow - Organisation]
      summary: Change login PIN
      description: Self-service 4-digit login PIN change, reusing caregiver's UpdateCodeDto unchanged.
      operationId: updateOrganisationCode
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^\\d{4}$"
                  example: "4321"
      responses:
        "200":
          description: Login code updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
              example:
                success: true
                data: { message: "Login code updated" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/organisation-requirements:
    get:
      tags: [Caregiver - Organisation Requirements]
      summary: Browse active organisation requirements
      description: >
        Every active requirement, joined with the posting organisation's
        name/type/city/area. caregiver-app merges this into the same Jobs
        tab as GET /caregiver/jobs (sorted together by posted_at) rather
        than a separate screen — an earlier iteration had a dedicated
        "Organisation Openings" tab; that was merged into Jobs on request.
        Each item includes my_application (null if this caregiver hasn't
        applied yet — same shape as GET /caregiver/jobs's my_application),
        added specifically to support that merge. Unlike GET
        /caregiver/jobs, there is no per-caregiver filtering yet (no
        gender/preferred-city/preferred-duty-type/salary equivalent) —
        every caregiver sees every active requirement.
      operationId: listActiveOrganisationRequirementsForCaregiver
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/OrganisationRequirement"
                        - type: object
                          properties:
                            my_application:
                              type: object
                              nullable: true
                              description: >
                                Null if the caregiver has never applied.
                                Same shape as GET /caregiver/jobs's
                                my_application (status/applied_at/
                                accepted_at/rejected_at/decided_by_admin).
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/organisation-requirements/assigned:
    get:
      tags: [Caregiver - Organisation Requirements]
      summary: The caller's currently held / completed organisation requirements
      description: >
        Mirrors GET /caregiver/jobs/assigned's shape exactly: each item is a
        full OrganisationRequirement record (not a bare application row)
        with a non-null my_application embedded, so caregiver-app's merged
        MyJobs list can render a job and an assigned requirement with the
        same card-rendering logic. Array-of-accepted-or-completed,
        oldest-decision-first by updated_at — the durable history the
        merged MyJobs tab renders. Does not additionally join in the
        posting organisation's own contact info the way
        GET /caregiver/jobs/assigned's job_poster does for jobs.
      operationId: listMyAssignedOrganisationRequirements
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Held/completed requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/OrganisationRequirement"
                        - type: object
                          properties:
                            my_application:
                              type: object
                              description: >
                                Never null here (only rows with an
                                accepted/completed application are
                                returned). Same shape as GET
                                /caregiver/organisation-requirements's
                                my_application.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/organisation-requirements/{id}/apply:
    post:
      tags: [Caregiver - Organisation Requirements]
      summary: Apply or self-decline on an organisation requirement
      description: >
        Same eligibility rule as jobs (available/assigned only, JOB_001
        otherwise); JOB_002 if the requirement isn't active.
      operationId: applyToOrganisationRequirement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [applied, rejected]
      responses:
        "200":
          description: Application recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string, enum: [applied, rejected] }
              example:
                success: true
                data: { message: "Application recorded", status: "applied" }
        "400":
          description: Requirement is closed and no longer accepting applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_002", message: "Job is closed and no longer accepting applications" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Caregiver's profile is not verified/available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_001", message: "Cannot apply to jobs until your profile is verified" }
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /caregiver/organisation-requirements/{id}/complete:
    post:
      tags: [Caregiver - Organisation Requirements]
      summary: Mark one held organisation requirement complete
      description: >
        Caregiver-only, no body. Mirrors POST /caregiver/jobs/{id}/complete
        exactly: flips that one application to completed (completed_at
        stamped) and drops verification_status back to available only once
        no other accepted applications remain — across both jobs and
        organisation requirements, since they share the same
        caregiver_profiles.verification_status field.
      operationId: completeOrganisationRequirement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      verification_status:
                        type: string
                        enum: [available, assigned]
              example:
                success: true
                data: { message: "Requirement marked complete", verification_status: "available" }
        "400":
          description: No active accepted application found for this requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_008", message: "No active accepted application found for this job" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisation-requirements:
    get:
      tags: [Admin - Organisation Requirements]
      summary: List every organisation requirement
      operationId: listAdminOrganisationRequirements
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending_review, active, closed] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganisationRequirement"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisation-requirements/{id}:
    get:
      tags: [Admin - Organisation Requirements]
      summary: Get an organisation requirement's full detail, including applicants
      operationId: getAdminOrganisationRequirementDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Requirement detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/OrganisationRequirement"
                      - type: object
                        properties:
                          applications:
                            type: array
                            items:
                              $ref: "#/components/schemas/OrganisationRequirementApplication"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Admin - Organisation Requirements]
      summary: Edit (and, from pending_review or closed, approve/repost) an organisation requirement
      description: >
        The approval path — same "edit with full shape" pattern as
        NurseNow - Individual's equivalent. Requires type_of_nurse,
        frequency_of_care, salary_amount, accommodation_provided,
        food_provided, schedule_type. schedule_type replaces the single
        start_date field entirely for organisation requirements — admin
        picks exactly one mode: date_range (requires start_date + end_date,
        end_date before start_date -> ORG_001) or specific_days (requires
        schedule_repeat plus a non-empty specific_days array whose valid
        range depends on it — weekday numbers 1-7 if schedule_repeat is
        weekly, a value outside 1-7 -> ORG_002; day-of-month numbers 1-31
        if schedule_repeat is monthly). Only the active mode's fields
        are persisted; the other mode's fields are ignored/nulled
        server-side regardless of what's sent. If the requirement was
        pending_review or closed, this activates it (stamps posted_at, and
        push-broadcasts "New Organisation Opening" to all caregivers); a
        plain edit of an already-active requirement does not resend it.
      operationId: updateAdminOrganisationRequirement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_of_nurse, frequency_of_care, salary_amount, accommodation_provided, food_provided, schedule_type]
              properties:
                type_of_nurse:
                  $ref: "#/components/schemas/TypeOfNurse"
                frequency_of_care:
                  $ref: "#/components/schemas/FrequencyOfCare"
                salary_amount:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                schedule_type:
                  $ref: "#/components/schemas/ScheduleType"
                start_date:
                  type: string
                  format: date
                  description: Required when schedule_type is date_range.
                end_date:
                  type: string
                  format: date
                  description: Required when schedule_type is date_range; must not be before start_date (ORG_001).
                schedule_repeat:
                  $ref: "#/components/schemas/ScheduleRepeat"
                  description: Required when schedule_type is specific_days.
                specific_days:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 31 }
                  description: >
                    Required (non-empty) when schedule_type is
                    specific_days. Weekday numbers 1-7 if schedule_repeat
                    is weekly, day-of-month numbers 1-31 if monthly.
                accommodation_provided:
                  type: boolean
                food_provided:
                  type: boolean
                special_skills:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Requirement updated (and activated, if it was pending_review/closed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/OrganisationRequirement"
        "400":
          description: >
            Validation error, end_date before start_date for a date_range
            schedule (ORG_001), or a specific_days value outside 1-7 for a
            weekly schedule (ORG_002)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "ORG_001", message: "End date cannot be before start date" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisation-requirements/{id}/reject:
    patch:
      tags: [Admin - Organisation Requirements]
      summary: Reject a pending-review organisation requirement
      description: >
        Declines a pending_review requirement: status closed,
        rejection_reason set, visible to the org on their own GET
        /organisation/requirements. JOB_011 if not currently pending_review.
      operationId: rejectAdminOrganisationRequirement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Requirement rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string, enum: [closed] }
              example:
                success: true
                data: { message: "Requirement rejected", status: "closed" }
        "400":
          description: Requirement is not pending_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_011", message: "Only a pending-review requirement can be rejected" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisation-requirements/{requirementId}/applications/{applicationId}:
    patch:
      tags: [Admin - Organisation Requirements]
      summary: Accept or reject an applicant on any organisation-posted requirement
      description: >
        Admin has full parity with the organisation's own decision — both
        call the same OrganisationRequirementsService.decideApplication.
      operationId: decideAdminOrganisationRequirementApplication
      security:
        - BearerAuth: []
      parameters:
        - name: requirementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                reason:
                  type: string
                  maxLength: 1000
                  description: Optional — admin's own reject flow stays reason-optional, same as NurseNow - Organisation's own decision endpoint.
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      status: { type: string, enum: [accepted, rejected] }
        "400":
          description: Application has already been decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_007", message: "Application has already been decided" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisations:
    get:
      tags: [Admin - Organisations]
      summary: List NurseNow organisation (hospital/rehab/clinic) accounts
      operationId: listAdminOrganisations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Paginated organisation accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        org_number:
                          type: integer
                          nullable: true
                          description: >
                            Human-friendly sequential id, starts at 500 (migration 046) —
                            displayed as "ORG-<n>" client-side.
                        full_name: { type: string }
                        phone: { type: string }
                        organisation_name: { type: string }
                        organisation_type:
                          $ref: "#/components/schemas/OrganisationType"
                        city: { type: string }
                        area: { type: string }
                        is_active: { type: boolean }
                        is_job_posting_blocked: { type: boolean }
                        block_reason: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisations/{id}:
    get:
      tags: [Admin - Organisations]
      summary: Get a NurseNow organisation account's detail
      operationId: getAdminOrganisationDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organisation account detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisations/{id}/block:
    patch:
      tags: [Admin - Organisations]
      summary: Block an organisation account
      description: >
        level=job_posting only stops new POST /organisation/requirements
        (JOB_010) — existing live requirements and their applications keep
        working, and login still succeeds. level=full sets users.is_active
        to false — a total login lockout (AUTH_004), same as a deactivated
        admin/caregiver/individual. Reuses the same BlockIndividualDto
        NurseNow - Individual's block endpoint uses (role-agnostic).
      operationId: blockOrganisation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, reason]
              properties:
                level:
                  type: string
                  enum: [job_posting, full]
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Account blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/organisations/{id}/unblock:
    patch:
      tags: [Admin - Organisations]
      summary: Unblock an organisation account
      operationId: unblockOrganisation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [job_posting, full]
      responses:
        "200":
          description: Account unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /app-versions/check:
    get:
      tags: [App Versions]
      summary: Check whether the caller's app build is below the admin-configured minimum
      description: |
        Public — no auth. Called by the caregiver app on every cold launch, before the splash
        screen even loads the session, so a caregiver who's never logged in still gets blocked
        on a too-old build. Fails open on the client side: any error here is treated as "no
        update needed."
      operationId: checkAppVersion
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: string, enum: [android, ios] }
        - name: version
          in: query
          required: true
          schema: { type: string }
          example: "1.1.0"
      responses:
        "200":
          description: Version check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/VersionCheckResult"
        "400":
          description: Missing/malformed platform or version (an unrecognized platform is rejected here too, by DTO validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_001", message: "Invalid request body" }
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/app-versions:
    get:
      tags: [Admin - App Versions]
      summary: List the minimum supported version for every platform
      operationId: listAppVersions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: App version list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppMinVersion"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/app-versions/{platform}:
    patch:
      tags: [Admin - App Versions]
      summary: Set the minimum supported version, store URL, and update message for a platform
      description: |
        Raising min_version above what a caregiver has installed blocks them with an "Update
        Required" screen on their next launch. Audit-logs app_version_updated with before/after
        min_version and store_url.
      operationId: updateAppVersion
      security:
        - BearerAuth: []
      parameters:
        - name: platform
          in: path
          required: true
          schema: { type: string, enum: [android, ios] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppVersionRequest"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/AppMinVersion"
        "400":
          description: Malformed min_version (must be x.y.z)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_001", message: "Invalid request body" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Unrecognized platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"
