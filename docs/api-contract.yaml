              example:
                success: true
                data:
                  user_id: "e4f5a6b7-c8d9-0123-ef01-456789012345"
                  patient_number: 500
                  full_name: "Asha Patel"
                  phone: "+919876543210"
                  is_job_posting_blocked: false
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /individual/requirements:
    post:
      tags: [NurseNow - Individual]
      summary: Post a new care requirement
      description: >
        Same request shape as POST /admin/jobs (care_receiver,
        city/area/description/duty_type/start_date/languages/
        preferred_gender/preferred_religion) except no frequency_of_care or
        salary_amount, which admin sets on approval. Always created with
        status pending_review. An account may have at most one live
        (pending_review or active) requirement at a time.
      operationId: createIndividualRequirement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Job"
              description: Same shape as the admin job-create body, minus frequency_of_care/salary_amount.
      responses:
        "201":
          description: Requirement created (pending_review)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/Job"
        "400":
          description: Validation error, or a live requirement already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_has_live_requirement:
                  summary: A pending_review or active requirement already exists
                  value:
                    success: false
                    error: { code: "JOB_009", message: "You already have a requirement in progress" }
        "403":
          description: Account is blocked from posting new requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_010", message: "Your account is blocked from posting new requirements" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [NurseNow - Individual]
      summary: List the caller's own requirement(s)
      description: >
        In practice zero-or-one item given the one-live-requirement limit —
        shaped as a list for symmetry with GET /caregiver/jobs/assigned.
        frequency_of_care/salary_amount are null until admin approves;
        rejection_reason is set only on a rejected (closed) requirement.
      operationId: listMyRequirements
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The caller's requirement(s)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /individual/requirements/{id}/applications:
    get:
      tags: [NurseNow - Individual]
      summary: List applicants on the caller's own requirement
      description: Ownership-checked — GEN_002 if the requirement isn't found or isn't owned by the caller.
      operationId: listMyRequirementApplications
      security:
        - BearerAuth: []
