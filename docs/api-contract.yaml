          description: Applicants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobApplication"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Requirement not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /individual/requirements/{jobId}/applications/{applicationId}/profile:
    get:
      tags: [NurseNow - Individual]
      summary: An applicant's full profile
      description: >
        Ownership-checked both ways — the requirement must be this
        individual's own AND the application must actually belong to it
        (GEN_002 otherwise). Returns the caregiver's complete
        CaregiverProfile: email, aadhaar_document_url,
        qualification_document_url, other_document_urls,
        preferred_cities, preferred_duty_types, min_salary_per_day,
        min_salary_per_month, and rejection_message are all included — same
        field names/types as GET /caregiver/profile.
      operationId: getMyRequirementApplicantProfile
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Applicant's full profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/CaregiverProfile"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Requirement/application not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /individual/requirements/{jobId}/applications/{applicationId}:
    patch:
      tags: [NurseNow - Individual]
      summary: Accept or reject an applicant on the caller's own requirement
      description: >
        Same body/behavior as the admin decide-application endpoint —
        accepting closes the requirement and assigns the caregiver;
        rejecting a still-applied applicant just declines them.
        Ownership-checked (GEN_002 if not the requirement's owner); admin
        can make the identical decision via
        PATCH /admin/jobs/{jobId}/applications/{applicationId}. Unlike
        admin's flow, rejecting here requires a non-blank `reason` — JOB_012
        otherwise. The reason is stored in decline_reason and returned on
        subsequent GET .../applications calls.
      operationId: decideMyRequirementApplication
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                reason:
                  type: string
                  maxLength: 1000
                  description: Required when status is rejected (JOB_012 otherwise); ignored/optional when accepting.
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/JobApplication"
        "400":
          description: Rejecting without a reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "JOB_012", message: "A reason is required when declining an applicant" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Requirement or application not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: { code: "GEN_002", message: "Resource not found" }
        "500":
          $ref: "#/components/responses/InternalError"

